apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-service-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users-service
  template:
    metadata:
      labels:
        app: users-service
    spec:
      containers:
        - name: users-service
          image: shop-grid-users-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8090
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: kubernetes
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://shopgrid-users-postgres:5432/users_db
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: users-db-secret
                  key: SHOPGRID_USERS_POSTGRES_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: users-db-secret
                  key: SHOPGRID_USERS_POSTGRES_PASSWORD
            - name: KEYCLOAK_LOGIN_CLIENT-SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-frontend-secret
                  key: KEYCLOAK_FRONTEND_CLIENT_SECRET
            - name: KEYCLOAK_ADMIN_CLIENT-SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-users-admin-secret
                  key: KEYCLOAK_USERS_ADMIN_CLIENT_SECRET
            - name: OTEL_SERVICE_NAME
              value: users-service

---
apiVersion: v1
kind: Service
metadata:
  name: users-service
spec:
  selector:
    app: users-service
  ports:
    - port: 8090
      targetPort: 8090
