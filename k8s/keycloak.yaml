apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:24.0.4
          command:
            - "/opt/keycloak/bin/kc.sh"
            - "start-dev"
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: keycloak-db-secret
            - secretRef:
                name: keycloak-admin-secret
          env:
            - name: KC_PROXY
              value: "edge"
            - name: KC_HOSTNAME
              value: keycloak.shopgrid
            - name: KC_HOSTNAME_PORT
              value: "80"
            - name: KC_DB
              value: "postgres"
            - name: KC_DB_URL_HOST
              value: "keycloak-postgres"
            - name: KC_DB_URL_DATABASE
              value: "keycloak_db"

---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector:
    app: keycloak
  ports:
    - port: 8080
      targetPort: 8080
#      nodePort: 30180