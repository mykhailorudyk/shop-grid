apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-db-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shopgrid-users-postgres
  template:
    metadata:
      labels:
        app: shopgrid-users-postgres
    spec:
      containers:
        - name: shopgrid-users-postgres
          image: postgres:18
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: users-db-secret
          env:
            - name: POSTGRES_DB
              value: "users_db"
          volumeMounts:
            - name: users-db-storage
              mountPath: /var/lib/postgresql

      volumes:
        - name: users-db-storage
          persistentVolumeClaim:
            claimName: users-db-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: shopgrid-users-postgres # DNS-ім'я
spec:
  selector:
    app: shopgrid-users-postgres
  ports:
    - port: 5432
      targetPort: 5432

