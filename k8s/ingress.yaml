apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shopgrid-ingress
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  ingressClassName: nginx
  rules:
    - host: keycloak.shopgrid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
    - host: api.shopgrid
      http:
        paths:
          - path: /api/v1/users
            pathType: Prefix
            backend:
              service:
                name: users-service
                port:
                  number: 8090
          - path: /api/v1/auth
            pathType: Prefix
            backend:
              service:
                name: users-service
                port:
                  number: 8090
          - path: /api/v1/products
            pathType: Prefix
            backend:
              service:
                name: products-service
                port:
                  number: 8088