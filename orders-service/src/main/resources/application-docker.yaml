server:
  port: 8089

spring:
  application:
    name: orders-service
  datasource:
    url: jdbc:postgresql://shopgrid-orders-postgres:5432/orders_db
    username: mike
    password: password
  jpa:
    properties:
      hibernate:
        format_sql: true
        show_sql: true
    hibernate:
      ddl-auto: create

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/ShopGrid
          jwk-set-uri: http://keycloak:8080/realms/ShopGrid/protocol/openid-connect/certs

app:
  services:
    products:
      url: http://products-service:8088
    users:
      url: http://users-service:8090